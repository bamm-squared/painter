name: Test and build portable apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-22.04
            binary: dist/Painter-linux-x86_64
            artifact: Painter-linux-x86_64
          - platform: Windows x86_64
            runner: windows-2022
            binary: dist/Painter-windows-x86_64.exe
            artifact: Painter-windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Test source
        run: python -m pytest -q
      - name: Build single-file app
        run: python scripts/build_portable.py
      - name: Smoke test bundled app
        run: python scripts/smoke_portable.py ${{ matrix.binary }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: Painter-*
          path: release
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release
          sha256sum Painter-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/Painter-* release/SHA256SUMS --verify-tag --generate-notes
