[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painter"
version = "0.1.3"
description = "A cross-platform paint app with alpha-aware colors, layers, and editable objects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "Pillow>=10.1"]

[project.scripts]
painter = "painter.app:run"

[tool.setuptools.packages.find]
include = ["painter*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
painter = ["assets/*.png", "assets/*.ico", "assets/*.svg"]

# GUI tests keep a QApplication reference alive even when it is not read again.
[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F841"]
